<div class="main-container">
  <!-- @if (quiz$ | async; as quiz)  -->
  @if (quiz) 
  {
    <h1>Quizz-game overview</h1>
    <div class="player-point-container">
      <div class="player-container">
        <h2>{{quiz.playerOne.email}}</h2>
        <p>Points: {{ quiz.playerOnePoints }}</p>
      </div>
      <div class="player-container">
        <h2>{{quiz.playerTwo.email}}</h2>
        <p>Points: {{ quiz.playerTwoPoints }}</p>
      </div>
    </div>


    <app-single-round *ngFor="let r of [].constructor(6); let i = index" [categoryNumber]="i" [quiz]="quiz">

    </app-single-round>



    <div>
      <select>
        <option *ngFor="let category of FileType2LabelMapping | keyvalue"
                [value]="category.key">
          {{ category.value}}
        </option>
      </select>
    </div>
  }
  <div class="button-container">
    <button mat-flat-button >Basic</button>
  </div>

</div>
