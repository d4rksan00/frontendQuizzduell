<div class="main-container">
  @if (quiz) {
    <h1>Quizz-game overview</h1>
    <div class="player-point-container">
      <div class="player-container">
        <h2>Player 1</h2>
        <p>Points: {{ quiz.playerOne.points }}</p>
      </div>
      <div class="player-container">
        <h2>Player 2</h2>
        <p>Points: {{ quiz.playerTwo.points }}</p>
      </div>
    </div>

    <app-single-round *ngFor="let r of [].constructor(6); let i = index" [round]="i" [quiz]="quiz">
    </app-single-round>

    <div class="button-container">
      <button style="color:green" (click)="winClick()">WIN a game</button>
      <button style="color: red" (click)="loseClick()">lose a game</button>
    </div>
  }

</div>
