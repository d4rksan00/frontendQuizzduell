<div class="main-container">
  <!-- @if (quiz$ | async; as quiz)  -->
  @if (quiz)
  {
    <h1>Quizz-game overview</h1>
    <div class="player-point-container">
      <div class="player-container">
        <h2>{{quiz.playerOne.email}}</h2>
        <p>Points: {{ quiz.playerOnePoints }}</p>
      </div>
      <div class="player-container">
        <h2>{{quiz.playerTwo.email}}</h2>
        <p>Points: {{ quiz.playerTwoPoints }}</p>
      </div>
    </div>

    <app-single-round *ngFor="let r of [].constructor(6); let i = index" [round]="i" [quiz]="quiz"
                      (categoryChanged)="onCategoryChanged($event)">
    </app-single-round>

    <div class="button-container">
      <button style="color:green" (click)="winClick()">WIN a game</button>
      <button style="color: red" (click)="loseClick()">lose a game</button>
    </div>
  }
  <div>
    <button class="startRound" (click)="gameStart()">Start Round</button>
  </div>
</div>
